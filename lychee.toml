# GitHub のソース行番号は見出しではないので、ローカル URL の行番号だけを外す。
# 参照先ファイルの存在は検査するため、リンク全体の exclude は使わない。
remap = ['^(file://[^#]+)#L[0-9]+(C[0-9]+)?(-L[0-9]+(C[0-9]+)?)?$ $1']

# .gitignore・.ignore の対象は lychee の既定で除外する。
# 隠しディレクトリの文書も検査するが、git の内部データは対象にしない。
# 文書のソースに完成後のパスを書くなど、検査から外す必要がある入力は理由を添えてここに足す。
exclude_path = ['(^|[/\\])\.git([/\\]|$)']
