# prefix を C-a に
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 基本
set -g default-shell /opt/homebrew/bin/fish
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:usstyle"
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
setw -g mode-keys vi

# 分割 (現在のディレクトリを引き継ぐ)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ペイン移動 (vim 風) / リサイズ
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# コピーモード (vi)
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# 設定再読み込み
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# ステータスバー (Solarized Dark)
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#073642,fg=#839496"
set -g status-left "#[bg=#268bd2,fg=#002b36,bold]  #S #[default] "
set -g status-right "#[fg=#586e75]%m/%d %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#002b36,fg=#b58900,bold] #I:#W "
set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#268bd2"
set -g message-style "bg=#073642,fg=#93a1a1"
