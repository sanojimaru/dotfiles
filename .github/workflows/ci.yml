# development のガードレール: CI。
#
# ローカルと同じ入口を呼ぶ:
# - `mise run setup`: 依存関係とgitフック（.mise/tasks/setup/<stack>）
# - `mise run check`: 速い検査。push の前に手元で走らせるものと同じ（pre-push はその記録を確かめる）
# - `mise run check:full`: check に IT・AT を足したもの。Docker が要るので ubuntu だけで回す
#   （AT が失敗したら、調べる材料を成果物として上げる）
# PR と main の CI は、check:full がまとめる種別ごとに matrix の別ジョブで呼ぶ。各入口は、
# .mise/tasks/check/<種別>/<stack> をワイルドカードで集めるため、スタックを足しても CI の編集は要らない。
#
# ランタイム（node・pnpm・python・uv・lefthook）は .mise/config.toml の [tools]（プロジェクトの
# mise.toml にあればそちらが勝つ）が正本で、jdx/mise-action が入れる。
#
# PR と main への push では ubuntu だけで検査を種別ごとに並列で回す。毎日 1 回の schedule でも回し、依存の更新などで壊れたことに
# PR を待たずに気づく。Linux でしか動かさないサーバーに、使わない OS の検査を走らせないため（#241）。
# クライアントアプリや Claude Code のプラグインのように macOS・Windows でも動かすものは、prepare-check の matrix
# ステップの引数と check-scheduled の matrix に OS を足し、setup でこのファイルを keep する。
#
# カバレッジ: unit と integration のジョブが書いた .guardrail/coverage/ を coverage ジョブが合算し、PR では diff-coverage が読んで変更行の
# カバレッジを Job Summary に報告し（.guardrail/thresholds.json の diff を下回ると失敗。既定は 90）、
# main への push では coverage-thresholds が読んで、閾値を引き上げられるときに、その案と手元で上げる手順を
# Job Summary とログに出す（閾値は下げない）。PR は作らない: 組織が Actions による PR の作成を止めていても
# 動くようにし、書き込みの権限もトークンも持たせないため。
#
# 必須チェック: development:setup が入れる ruleset が、このファイルの ci-required と guardrail.yml の
# guardrail-rules の 2 つを必須のチェックにする。ci-required はほかの全ジョブの結果をまとめるので、このファイルに
# ジョブが増えても必須チェックの名前は変わらない。配布版のジョブを消すか ci-required の needs から外すと、
# guardrail-rules（規則 ci-required-jobs）が落ちる。
# 導入先が独自に持つ CI（サービスごとの CI など）は、このファイルに足さず、別のワークフローファイルに
# 置いて、そのまとめのジョブも必須チェックに足す。このファイルを書き換えなければ、setup の更新で
# 配布版にそのまま置き換えられる。別のファイルの name は CI 以外にする（concurrency の group が
# github.workflow で分かれず、互いの実行を取り消し合うため）。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 03:00 JST 固定実行（依存の更新などで壊れたことに気づくため）
    - cron: "0 18 * * *"
  workflow_dispatch:

# ワークフローの既定の権限は空にし、ジョブごとに要る権限だけを書く（導入先の既定が広くても広がらない）。
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 検査の種別は .mise/tasks/check/<種別>/ から作る。タスクを足したときに、手元と CI がずれないため。
  prepare-check:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: |
          matrix=$(node scripts/guardrail-check.mjs matrix ubuntu-latest)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  check:
    needs: prepare-check
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # PR と Issue の本文を読む（受け入れテストの AC の出どころ）。既定の権限が狭いリポジトリでも読めるように明示する。
    permissions:
      contents: read
      pull-requests: read
      issues: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-check.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 導入先が履歴やタグを使う検査（legacy snapshot の照合など）を check に足しても、浅い clone で落ちないようにする。
          fetch-depth: 0
          fetch-tags: true
      # Terraform の provider は容量が大きく、空のランナーで毎回取り直すと setup が長くなるので、lock file が
      # 変わるまでジョブの間で残す。lock file が変わったときは新しい cache を作り、使わない古い版を抱え続けない。
      - name: Restore Terraform provider cache
        if: hashFiles('.guardrail/answers/terraform.yml') != ''
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/.terraform.lock.hcl') }}
      # provider を、モジュールごとに複製せず復元した 1 つのキャッシュから使う（モジュールが多いとランナーの
      # ディスクが尽きる）。setup と検査の間で checkout を変えないので、setup が成功した印も一時ファイルに置き、
      # 直後の検査が同じモジュールをもう一度 init しないようにする。
      - name: Prepare Terraform provider cache
        if: hashFiles('.guardrail/answers/terraform.yml') != ''
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugin-cache" >> "$GITHUB_ENV"
          echo "GUARDRAIL_TERRAFORM_INIT_DONE=$RUNNER_TEMP/guardrail-terraform-init-done" >> "$GITHUB_ENV"
      # Go の build・module cache と golangci-lint cache は、検査時間の大半を占める再ビルドを
      # ジョブごとに繰り返さないために残す。mise・module・lint の設定が変われば新しい cache を作り、
      # その場合も同じ OS・CPU の過去の cache を土台にする。mise が Go のツールを入れる前に復元し、
      # 書き込み不可の module cache と復元する archive が衝突しないようにする。
      - name: Restore Go caches
        if: hashFiles('.guardrail/answers/go.yml') != ''
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise/config.toml', 'mise.toml', '**/go.mod', '**/go.sum', '.golangci.yml', '.golangci.yaml') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
        # tflint --init はルールセットを GitHub から取る。未認証だと回数制限に当たるので、ワークフローのトークンを渡す
        # （読むだけなので権限は足さない）。
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # 受け入れテストの reporter（tests/acceptance/support/ac-report.ts）は、ここで置いた PR の本文と、
      # PR が閉じる Issue の本文に書かれた AC ごとに、テストがあるかを確かめる（無ければ check:at が落ちる）。
      - if: matrix.task == 'check:at' && github.event_name == 'pull_request' && hashFiles('tests/acceptance/playwright.config.ts') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AC_DIR: ${{ runner.temp }}/ac-sources
        run: |
          mkdir -p "$AC_DIR"
          gh pr view "$PR" --json body --jq .body > "$AC_DIR/pr.md"
          # 別のリポジトリの Issue も閉じられるので、番号ではなく URL で取る。取れなければここで落とす
          # （for の中の $(...) の失敗は set -e でも止まらない）。
          urls=$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences[].url')
          i=0
          for url in $urls; do
            i=$((i + 1))
            gh issue view "$url" --json body --jq .body > "$AC_DIR/issue-$i.md"
          done
          echo "AC_SOURCES=$AC_DIR" >> "$GITHUB_ENV"
      - run: mise run ${{ matrix.task }}
      # 受け入れテストが失敗したときの、trace・スクリーンショット・動画・
      # compose のログ・HTML レポート。検査の列挙ではなく、check:at が残すものの受け取り口。
      # AC ごとの一覧はジョブの概要（GITHUB_STEP_SUMMARY）に出る。
      - if: failure() && matrix.task == 'check:at'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: acceptance-test-results
          path: |
            tests/acceptance/test-results/
            tests/acceptance/playwright-report/
          if-no-files-found: ignore
      - if: ${{ !cancelled() && startsWith(matrix.os, 'ubuntu-') && (matrix.task == 'check:unit' || matrix.task == 'check:it') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: guardrail-coverage-${{ matrix.coverage }}
          path: .guardrail/coverage/
          include-hidden-files: true
          if-no-files-found: ignore

  # unit と integration の別ランナーで計測したカバレッジを合算し、全体の下限を判定する。
  coverage:
    needs: check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        # テストが0件だと成果物が無い。coverage:check が「記録したスタックが無い」と報告する。
        continue-on-error: true
        with:
          pattern: guardrail-coverage-*
          merge-multiple: true
          path: .guardrail/coverage/
      - uses: jdx/mise-action@v5.2.10
      - run: mise run coverage:check
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: guardrail-coverage
          path: .guardrail/coverage/
          include-hidden-files: true
          if-no-files-found: ignore

  diff-coverage:
    needs: coverage
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 変更行を base ブランチとの差分で求めるため、履歴を全部取る。
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        # テストが0件だとカバレッジが無い。そのときは「記録したスタックが無い」と報告する。
        continue-on-error: true
        with:
          name: guardrail-coverage
          path: .guardrail/coverage/
      - uses: jdx/mise-action@v5.2.10
      - run: mise run coverage:diff

  coverage-thresholds:
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          name: guardrail-coverage
          path: .guardrail/coverage/
      - uses: jdx/mise-action@v5.2.10
      - id: raise
        run: mise run coverage:raise
      # 引き上げられるときだけ、案と手元で上げる手順（raise.md）を Job Summary とログに出す。ジョブは成功のまま。
      - if: steps.raise.outputs.changed == 'true'
        run: tee -a "$GITHUB_STEP_SUMMARY" < .guardrail/coverage/raise.md

  # 毎日の schedule では、PR と同じ check の matrix の代わりにこれを回す。
  check-scheduled:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # provider cache と GITHUB_TOKEN は check ジョブと同じ理由で置く。
      - name: Restore Terraform provider cache
        if: hashFiles('.guardrail/answers/terraform.yml') != ''
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/.terraform.lock.hcl') }}
      - name: Prepare Terraform provider cache
        if: hashFiles('.guardrail/answers/terraform.yml') != ''
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugin-cache" >> "$GITHUB_ENV"
          echo "GUARDRAIL_TERRAFORM_INIT_DONE=$RUNNER_TEMP/guardrail-terraform-init-done" >> "$GITHUB_ENV"
      - name: Restore Go caches
        if: hashFiles('.guardrail/answers/go.yml') != ''
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise/config.toml', 'mise.toml', '**/go.mod', '**/go.sum', '.golangci.yml', '.golangci.yaml') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run check

  # リポジトリにあるスタックと、導入済みのガードレールのずれを警告する（Issue #527）。
  # サブディレクトリに増えたスタックや stack.toml の無い言語も見る。PR は止めない。
  # mise を通さずに sh で呼ぶ（mise run は既定で [tools] を全部入れるため、この軽い検査には重い）。
  guardrail-drift:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh .mise/tasks/guardrail/drift

  # 必須チェックにするジョブ。ほかの全ジョブを needs に並べ、どれかが failure か cancelled なら失敗する
  # （needs の入れ忘れは development の検査が落とす）。
  # イベントで走らないジョブは skipped になるので、skipped は成功として扱う。always() にするのは、
  # 上流の失敗でこのジョブ自身が skipped になると、必須チェックが通ったと扱われるため。
  ci-required:
    needs:
      [
        check,
        prepare-check,
        coverage,
        diff-coverage,
        coverage-thresholds,
        check-scheduled,
        guardrail-drift,
      ]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "失敗か取り消しになったジョブがあります: $RESULTS"
          exit 1
