# development のガードレール: 規則の判定。必須の規則を外した PR を、マージの前に止める。
#
# 判定器は、このリポジトリの scripts/guardrail-rules.mjs のコピーではなく、engineering-standards のものを
# commit の SHA で固定して呼ぶ（PR でコピーを書き換えても、判定は変わらない）。SHA は development:setup が
# 置いた版のもの。
# development:setup が入れる ruleset（development guardrail）が、このジョブ guardrail-rules を必須の
# チェックにする。このジョブやファイルを消した PR は、必須のチェックが報告されないのでマージできない。
# ci.yml と分けるのは、ci.yml を keep している導入先にも届けるため。
name: Guardrail

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  guardrail-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # 判定器がカバレッジの閾値をマージ先と比べるため、PR のマージコミットの親（マージ先の先端）まで取る。
          # ref は既定（PR ではマージコミット）のままにする。PR の head に変えると、親がマージ先でなくなる。
          fetch-depth: 2
      - uses: spikestudio/engineering-standards/plugins/development/actions/guardrail-rules@1bef8bc796be70af2fcda0af2ef69fbe373fc0cb
